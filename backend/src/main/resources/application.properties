# Configuracion de la aplicacion
spring.application.name=calyma-ecommerce-backend
server.port=8082

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/calyma_ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=calyma_user
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false


spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m


server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/


logging.level.org.springframework=ERROR
logging.level.com.calyma=DEBUG
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
logging.level.root=ERROR



